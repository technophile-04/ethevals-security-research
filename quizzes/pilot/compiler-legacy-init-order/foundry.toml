[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc = "0.8.30"
evm_version = "prague"
via_ir = false
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=../deps/oz5/"]
allow_paths = ["../deps"]

# contrast run: same source, IR pipeline
[profile.viair]
test = "test-viair"
via_ir = true
