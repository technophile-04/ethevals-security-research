[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc = "0.8.24"
evm_version = "cancun"
via_ir = false
optimizer = true
optimizer_runs = 200
remappings = [
  "oz4u/=../deps/oz496u/",
  "@openzeppelin/contracts-upgradeable/=../deps/oz5u/",
  "@openzeppelin/contracts/=../deps/oz5/",
]
allow_paths = ["../deps"]
