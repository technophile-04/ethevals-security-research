[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc = "0.8.33"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=../deps/oz5/"]
allow_paths = ["../deps"]

# controls: the fixed compiler, and the legacy pipeline on the affected compiler
