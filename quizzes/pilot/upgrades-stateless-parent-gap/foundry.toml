[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc = "0.8.24"
evm_version = "cancun"
via_ir = false
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts-upgradeable/=../deps/oz496u/", "@openzeppelin/contracts/=../deps/oz496/"]
allow_paths = ["../deps"]
